services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lorecommander_app
    networks:
      - lorecommander_network
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html/LoreCommander
      - ../ZZermelo:/var/www/html/Zermelo
      - ../DURCC:/var/www/html/DURC
      # Mount a volume for the local image cache
      - lorecommander_imgdata:/var/www/html/LoreCommander/public/imgdata
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-lorecommander}
      - DB_USERNAME=${DB_USERNAME:-loreuser}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

  db:
    image: mariadb:10.5
    container_name: lorecommander_db
    networks:
      - lorecommander_network
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-lorecommander}
      MYSQL_USER: ${DB_USERNAME:-loreuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "3306:3306"
    volumes:
      - lorecommander_db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  lorecommander_db_data:
  lorecommander_imgdata:

networks:
  lorecommander_network:
    driver: bridge
